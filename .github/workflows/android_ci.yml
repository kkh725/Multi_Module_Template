name: Android CI

on:
    push:
        branches: [ "master" ]
    pull_request:
        branches: [ "master" ]

jobs:
    check:
        runs-on: ubuntu-latest

        permissions:
            contents: write

        steps:
            -   uses: actions/checkout@v4
                with:
                    ref: ${{ github.head_ref }}
                    fetch-depth: 0

            -   name: Set up JDK 21
                uses: actions/setup-java@v4
                with:
                    java-version: '21'
                    distribution: 'temurin'

            -   name: Setup Gradle
                uses: gradle/actions/setup-gradle@v4
                with:
                    add-job-summary: always
                    # PR 빌드: 캐시 읽기, master push: 캐시 업데이트
                    cache-read-only: ${{ github.event_name == 'pull_request' }}

            -   name: Grant execute permission for gradlew
                run: chmod +x gradlew

            -   name: Set up local.properties
                run: |
                    echo "KKH_SERVER_BASE_URL=${{ secrets.KKH_SERVER_BASE_URL }}" > local.properties

            -   name: Decode keystore file
                run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ./app/upload-keystore.jks

            #            -   name: KtlintCheck
            #                run: ./gradlew ktlintCheck --no-daemon
            #
            #            -   name: Test
            #                run: ./gradlew test --stacktrace --no-daemon
            #
            -   name: Compile Check (Debug)
                run: ./gradlew compileDebugKotlin compileDebugJavaWithJavac --no-daemon

            # script 를 통해 dependency graph 생성
            -   name: Generate dependency graph
                run: |
                    chmod +x scripts/update-dependency-graph.sh
                    ./scripts/update-dependency-graph.sh

            # CI에서 생성된 그래프 vs PR target branch(master)의 그래프 비교 후 auto 커밋
            -   name: Check dependency graph update
                run: |
                    git fetch origin ${{ github.base_ref }}

                    if git diff --quiet origin/${{ github.base_ref }} -- docs/module-deps.md; then
                    echo "No changes in dependency graph"
                    else
                    git config user.name "github-actions[bot]"
                    git config user.email "github-actions[bot]@users.noreply.github.com"

                    # commit -> push
                    git add docs/module-deps.md
                    if git commit -m "[github-actions] update module dependency graph"; then
                    git push origin HEAD:${{ github.head_ref }}
                    echo "Dependency graph updated and committed automatically."

                    else
                    echo "different with master, but not in local"
                    exit 0
                    fi

