name: Android CI

on:
    push:
        branches: [ "master" ]
    pull_request:
        branches: [ "master" ]

jobs:
    check:
        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@v4

            -   name: Set up JDK 21
                uses: actions/setup-java@v4
                with:
                    java-version: '21'
                    distribution: 'temurin'

            -   name: Setup Gradle
                uses: gradle/actions/setup-gradle@v4
                with:
                    add-job-summary: always
                    # PR 빌드: 캐시 읽기, master push: 캐시 업데이트
                    cache-read-only: ${{ github.event_name == 'pull_request' }}

            -   name: Grant execute permission for gradlew
                run: chmod +x gradlew

            -   name: Set up local.properties
                run: |
                    echo "KKH_SERVER_BASE_URL=${{ secrets.KKH_SERVER_BASE_URL }}" > local.properties

            -   name: Decode keystore file
                run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ./app/upload-keystore.jks

#            -   name: KtlintCheck
#                run: ./gradlew ktlintCheck --no-daemon
#
#            -   name: Test
#                run: ./gradlew test --stacktrace --no-daemon
#
            -   name: Compile Check (Debug)
                run: ./gradlew compileDebugKotlin compileDebugJavaWithJavac --no-daemon

            # script 를 통해 dependency graph 생성
            -   name: Generate dependency graph
                run: |
                    chmod +x scripts/update-dependency-graph.sh
                    ./scripts/update-dependency-graph.sh

            # PR target module-deps vs local module-deps
            # PR target branch와 비교
            -   name: Check for changes
                run: |
                    git fetch origin ${{ github.base_ref }}

                    # master에 파일이 없으면 자동 통과하지 않도록
                    if git diff --exit-code origin/${{ github.base_ref }}...HEAD -- docs/module-deps.md; then
                      echo "✅ No changes in dependency graph"
                    else
                      echo "❌ Dependency graph has changed or is new"
                      echo ""
                      echo "Diff:"
                      git diff origin/${{ github.base_ref }}...HEAD -- docs/module-deps.md
                      exit 1
                    fi