import groovy.json.JsonOutput

tasks.register('projectDependencyGraph') {
    doLast {
        def outputDir = new File(rootProject.layout.buildDirectory.asFile.get(), 'reports/dependency-graph')
        outputDir.mkdirs()
        def dot = new File(outputDir, 'project.dot')
        dot.delete()

        dot.text = 'digraph {\n'
        dot.append("  graph [label=\"${rootProject.name}\\n \",labelloc=t,fontsize=30,ranksep=1.4];\n")
        dot.append('  node [style=filled, fillcolor="#bbbbbb"];\n')
        dot.append('  rankdir=TB;\n')

        def rootProjects = []
        def queue = [rootProject]
        while (!queue.isEmpty()) {
            def project = queue.remove(0)
            rootProjects.add(project)
            queue.addAll(project.childProjects.values())
        }

        def projects = new LinkedHashSet<Project>()
        def dependencies = new LinkedHashMap<Tuple2<Project, Project>, List<String>>()
        def multiplatformProjects = []
        def jsProjects = []
        def androidProjects = []
        def javaProjects = []

        queue = [rootProject]
        while (!queue.isEmpty()) {
            def project = queue.remove(0)
            queue.addAll(project.childProjects.values())

            if (project.plugins.hasPlugin('org.jetbrains.kotlin.multiplatform')) {
                multiplatformProjects.add(project)
            }
            if (project.plugins.hasPlugin('org.jetbrains.kotlin.js')) {
                jsProjects.add(project)
            }
            if (project.plugins.hasPlugin('com.android.library') || project.plugins.hasPlugin('com.android.application')) {
                androidProjects.add(project)
            }
            if (project.plugins.hasPlugin('java-library') || project.plugins.hasPlugin('java')) {
                javaProjects.add(project)
            }

            project.configurations.configureEach { config ->
                config.dependencies
                        .withType(ProjectDependency)
                        .each { ProjectDependency dep ->
                            def dependencyProject = rootProject.findProject(dep.path)
                            if (dependencyProject != null && dependencyProject != project) {
                                projects.add(project)
                                projects.add(dependencyProject)
                                rootProjects.remove(dependencyProject)

                                def graphKey = new Tuple2<Project, Project>(project, dependencyProject)
                                def traits = dependencies.computeIfAbsent(graphKey) { new ArrayList<String>() }

                                if (config.name.toLowerCase().endsWith('implementation')) {
                                    traits.add('style=dotted')
                                }
                            }
                        }
            }
        }

        projects = projects.sort { it.path }

        dot.append('\n  # Projects\n\n')
        for (project in projects) {
            def traits = []

            if (rootProjects.contains(project)) {
                traits.add('shape=box')
            }

            if (multiplatformProjects.contains(project)) {
                traits.add('fillcolor="#ffd2b3"')
            } else if (jsProjects.contains(project)) {
                traits.add('fillcolor="#ffffba"')
            } else if (androidProjects.contains(project)) {
                traits.add('fillcolor="#baffc9"')
            } else if (javaProjects.contains(project)) {
                traits.add('fillcolor="#ffb3ba"')
            } else {
                traits.add('fillcolor="#eeeeee"')
            }

            dot.append("  \"${project.path}\" [${traits.join(", ")}];\n")
        }

        dot.append('\n  {rank = same;')
        for (project in projects) {
            if (rootProjects.contains(project)) {
                dot.append(" \"${project.path}\";")
            }
        }
        dot.append('}\n')

        dot.append('\n  # Dependencies\n\n')
        dependencies.forEach { key, traits ->
            if (key.first.path != key.second.path) {
                dot.append("  \"${key.first.path}\" -> \"${key.second.path}\"")
                if (!traits.isEmpty()) {
                    dot.append(" [${traits.join(", ")}]")
                }
                dot.append('\n')
            }
        }

        dot.append('}\n')

        // Generate PNG using Graphviz (requires 'dot' command installed)
        try {
            def process = ['dot', '-Tpng', '-O', 'project.dot'].execute([], outputDir)
            process.waitFor()
            if (process.exitValue() != 0) {
                println("Warning: Could not generate PNG. Error: ${process.errorStream.text}")
                println("Make sure Graphviz is installed (brew install graphviz)")
            } else {
                println("Project module dependency graph created at ${dot.absolutePath}.png")
            }
        } catch (Exception e) {
            println("Warning: Could not generate PNG. Graphviz 'dot' command not found.")
            println("Install Graphviz: brew install graphviz")
            println("DOT file created at: ${dot.absolutePath}")
        }
    }
}

tasks.register("dumpModuleDeps") {
    group = "reporting"
    description = "Dump module dependency graph as JSON for Mermaid"

    doLast {
        def result = [:].withDefault { [] }

        def queue = [rootProject]
        while (!queue.isEmpty()) {
            def project = queue.remove(0)
            queue.addAll(project.childProjects.values())

            project.configurations.configureEach { config ->
                config.dependencies
                    .withType(ProjectDependency)
                    .each { ProjectDependency dep ->
                        def dependencyProject = rootProject.findProject(dep.path)
                        if (dependencyProject != null && dependencyProject != project) {
                            result[project.path] << dependencyProject.path
                        }
                    }
            }

            // 의존성 없는 모듈도 노드로 찍히게
            if (!result.containsKey(project.path)) {
                result[project.path] = []
            }
        }

        // 중복 제거 + 정렬
        result = result.collectEntries { k, v ->
            [(k): v.unique().sort()]
        }.sort()

        def outFile = file("$buildDir/module-deps.json")
        outFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(result))

        println "Wrote module deps to: $outFile"
    }
}
